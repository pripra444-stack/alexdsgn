<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <defs>
    <linearGradient id="bg4" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#030a14"/><stop offset="100%" stop-color="#060f1e"/></linearGradient>
    <radialGradient id="glowCenter4" cx="50%" cy="50%" r="55%"><stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.12"/><stop offset="100%" stop-color="#0ea5e9" stop-opacity="0"/></radialGradient>
    <linearGradient id="barGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#38bdf8"/><stop offset="100%" stop-color="#0ea5e9" stop-opacity="0.6"/></linearGradient>
    <linearGradient id="barGradDim" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#1e4060"/><stop offset="100%" stop-color="#0d1824"/></linearGradient>
    <filter id="glow4"><feGaussianBlur stdDeviation="10" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="textGlow"><feGaussianBlur stdDeviation="6" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1080" height="1080" fill="url(#bg4)"/>
  <rect width="1080" height="1080" fill="url(#glowCenter4)"/>

  <!-- Subtle grid lines -->
  <line x1="0" y1="300" x2="1080" y2="300" stroke="#38bdf8" stroke-width="1" opacity="0.04"/>
  <line x1="0" y1="500" x2="1080" y2="500" stroke="#38bdf8" stroke-width="1" opacity="0.04"/>
  <line x1="0" y1="700" x2="1080" y2="700" stroke="#38bdf8" stroke-width="1" opacity="0.04"/>

  <!-- Counter -->
  <circle cx="52" cy="52" r="9" fill="#38bdf8"/>
  <text x="72" y="58" font-family="Arial, sans-serif" font-size="24" fill="#38bdf8" font-weight="700" letter-spacing="1">04 / 04</text>

  <!-- Title block -->
  <text x="52" y="160" font-family="Arial Black, Arial, sans-serif" font-size="82" fill="white" font-weight="900">Результат</text>
  <text x="52" y="208" font-family="Arial, sans-serif" font-size="26" fill="#38bdf8" opacity="0.75">после редизайна Hero-экрана</text>

  <!-- Divider line -->
  <line x1="52" y1="236" x2="460" y2="236" stroke="#38bdf8" stroke-width="1.5" opacity="0.3"/>

  <!-- Big metric cards row -->
  <!-- Metric 1: CTR -->
  <rect x="52" y="262" width="284" height="180" rx="20" fill="#071526" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.5"/>
  <text x="194" y="320" font-family="Arial, sans-serif" font-size="16" fill="#38bdf8" opacity="0.7" text-anchor="middle" letter-spacing="2">CTR</text>
  <text x="194" y="398" font-family="Arial Black, Arial, sans-serif" font-size="72" fill="#38bdf8" font-weight="900" text-anchor="middle" filter="url(#textGlow)">+28%</text>
  <text x="194" y="428" font-family="Arial, sans-serif" font-size="15" fill="#555" text-anchor="middle">кликабельность</text>

  <!-- Metric 2: Conversion -->
  <rect x="360" y="262" width="284" height="180" rx="20" fill="#071526" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.5"/>
  <text x="502" y="320" font-family="Arial, sans-serif" font-size="16" fill="#38bdf8" opacity="0.7" text-anchor="middle" letter-spacing="2">КОНВЕРСИЯ</text>
  <text x="502" y="398" font-family="Arial Black, Arial, sans-serif" font-size="72" fill="#38bdf8" font-weight="900" text-anchor="middle" filter="url(#textGlow)">×1.8</text>
  <text x="502" y="428" font-family="Arial, sans-serif" font-size="15" fill="#555" text-anchor="middle">в покупку</text>

  <!-- Metric 3: Revenue -->
  <rect x="668" y="262" width="360" height="180" rx="20" fill="#071526" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.5"/>
  <text x="848" y="320" font-family="Arial, sans-serif" font-size="16" fill="#38bdf8" opacity="0.7" text-anchor="middle" letter-spacing="2">ВЫРУЧКА / МЕСЯЦ</text>
  <text x="848" y="398" font-family="Arial Black, Arial, sans-serif" font-size="62" fill="#38bdf8" font-weight="900" text-anchor="middle" filter="url(#textGlow)">+340K ₽</text>
  <text x="848" y="428" font-family="Arial, sans-serif" font-size="15" fill="#555" text-anchor="middle">прирост к предыдущему периоду</text>

  <!-- Chart section -->
  <text x="52" y="490" font-family="Arial, sans-serif" font-size="20" fill="#38bdf8" opacity="0.65" letter-spacing="1">ДИНАМИКА CTR — ДО И ПОСЛЕ</text>
  <line x1="52" y1="502" x2="1028" y2="502" stroke="#1e4060" stroke-width="1"/>

  <!-- Bar chart: Before (dim) and After (bright) for 4 weeks -->
  <!-- Week labels -->
  <text x="136" y="730" font-family="Arial, sans-serif" font-size="15" fill="#444" text-anchor="middle">Неделя 1</text>
  <text x="336" y="730" font-family="Arial, sans-serif" font-size="15" fill="#444" text-anchor="middle">Неделя 2</text>
  <text x="536" y="730" font-family="Arial, sans-serif" font-size="15" fill="#38bdf8" text-anchor="middle">Неделя 3</text>
  <text x="736" y="730" font-family="Arial, sans-serif" font-size="15" fill="#38bdf8" text-anchor="middle">Неделя 4</text>

  <!-- Legend -->
  <rect x="800" y="490" width="14" height="14" rx="3" fill="#1e4060"/>
  <text x="820" y="502" font-family="Arial, sans-serif" font-size="14" fill="#555">До редизайна</text>
  <rect x="950" y="490" width="14" height="14" rx="3" fill="#38bdf8"/>
  <text x="970" y="502" font-family="Arial, sans-serif" font-size="14" fill="#38bdf8">После</text>

  <!-- Baseline -->
  <line x1="52" y1="715" x2="1028" y2="715" stroke="#1e4060" stroke-width="1.5"/>

  <!-- Bar pair 1 (before redizain, week 1) -->
  <rect x="80" y="605" width="60" height="110" rx="6" fill="url(#barGradDim)"/>
  <!-- Bar pair 1 (after, week 1 - slightly higher but still "before") -->
  <rect x="152" y="595" width="60" height="120" rx="6" fill="url(#barGradDim)" opacity="0.7"/>

  <!-- Bar pair 2 (before, week 2) -->
  <rect x="280" y="600" width="60" height="115" rx="6" fill="url(#barGradDim)"/>
  <!-- Bar pair 2 (after, week 2) -->
  <rect x="352" y="582" width="60" height="133" rx="6" fill="url(#barGradDim)" opacity="0.7"/>

  <!-- Bar pair 3 (week 3 - LAUNCH week, after redizain) -->
  <rect x="480" y="600" width="60" height="115" rx="6" fill="url(#barGradDim)"/>
  <!-- After (bright) -->
  <rect x="552" y="535" width="60" height="180" rx="6" fill="url(#barGrad)" filter="url(#glow4)" opacity="0.9"/>

  <!-- Bar pair 4 (week 4 - full after) -->
  <rect x="680" y="605" width="60" height="110" rx="6" fill="url(#barGradDim)"/>
  <!-- After (bright, biggest gain) -->
  <rect x="752" y="505" width="60" height="210" rx="6" fill="url(#barGrad)" filter="url(#glow4)"/>

  <!-- "Запуск" arrow annotation -->
  <line x1="582" y1="520" x2="582" y2="490" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.8"/>
  <circle cx="582" cy="520" r="4" fill="#38bdf8"/>
  <text x="582" y="482" font-family="Arial, sans-serif" font-size="13" fill="#38bdf8" text-anchor="middle" opacity="0.9">запуск</text>

  <!-- Growth arrow line overlay -->
  <polyline points="112,650 312,645 512,645 712,550 900,480" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="6 4" opacity="0.35"/>

  <!-- Right side: before/after comparison mini cards -->
  <rect x="860" y="530" width="168" height="86" rx="12" fill="#0a1828" stroke="#1e4060" stroke-width="1"/>
  <text x="876" y="556" font-family="Arial, sans-serif" font-size="13" fill="#555">До</text>
  <text x="876" y="580" font-family="Arial Black, Arial, sans-serif" font-size="30" fill="#555">2.1%</text>
  <text x="876" y="604" font-family="Arial, sans-serif" font-size="12" fill="#333">CTR до редизайна</text>

  <rect x="860" y="632" width="168" height="86" rx="12" fill="#071e33" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.6"/>
  <text x="876" y="658" font-family="Arial, sans-serif" font-size="13" fill="#38bdf8">После</text>
  <text x="876" y="682" font-family="Arial Black, Arial, sans-serif" font-size="30" fill="#38bdf8" filter="url(#textGlow)">2.7%</text>
  <text x="876" y="706" font-family="Arial, sans-serif" font-size="12" fill="#38bdf8" opacity="0.6">CTR после редизайна</text>

  <!-- Bottom summary strip -->
  <rect x="52" y="755" width="976" height="110" rx="20" fill="#040e1a" stroke="#1e4060" stroke-width="1"/>
  <!-- Checkmarks -->
  <circle cx="92" cy="810" r="18" fill="#071e33" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.6"/>
  <text x="92" y="817" font-family="Arial, sans-serif" font-size="18" fill="#38bdf8" text-anchor="middle">✓</text>
  <text x="122" y="806" font-family="Arial, sans-serif" font-size="17" fill="white" font-weight="700">CTR +28%</text>
  <text x="122" y="828" font-family="Arial, sans-serif" font-size="14" fill="#555">рост кликов</text>

  <circle cx="310" cy="810" r="18" fill="#071e33" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.6"/>
  <text x="310" y="817" font-family="Arial, sans-serif" font-size="18" fill="#38bdf8" text-anchor="middle">✓</text>
  <text x="340" y="806" font-family="Arial, sans-serif" font-size="17" fill="white" font-weight="700">Конверсия ×1.8</text>
  <text x="340" y="828" font-family="Arial, sans-serif" font-size="14" fill="#555">больше покупок</text>

  <circle cx="562" cy="810" r="18" fill="#071e33" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.6"/>
  <text x="562" y="817" font-family="Arial, sans-serif" font-size="18" fill="#38bdf8" text-anchor="middle">✓</text>
  <text x="592" y="806" font-family="Arial, sans-serif" font-size="17" fill="white" font-weight="700">Выручка +340K ₽</text>
  <text x="592" y="828" font-family="Arial, sans-serif" font-size="14" fill="#555">прирост/мес</text>

  <!-- Right badge -->
  <rect x="830" y="768" width="190" height="74" rx="12" fill="#0ea5e9" opacity="0.9"/>
  <text x="925" y="799" font-family="Arial Black, Arial, sans-serif" font-size="18" fill="white" font-weight="900" text-anchor="middle">КЕЙС ЗАКРЫТ</text>
  <text x="925" y="824" font-family="Arial, sans-serif" font-size="14" fill="white" text-anchor="middle" opacity="0.85">3 нед. · NEOTECH</text>
</svg>
