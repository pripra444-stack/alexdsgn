  <g fill="#1e4060" opacity="0.9">
    <circle cx="680" cy="272" r="3.5"/><circle cx="700" cy="272" r="3.5"/><circle cx="720" cy="272" r="3.5"/><circle cx="740" cy="272" r="3.5"/><circle cx="760" cy="272" r="3.5"/><circle cx="780" cy="272" r="3.5"/><circle cx="800" cy="272" r="3.5"/><circle cx="820" cy="272" r="3.5"/>
    <circle cx="680" cy="292" r="3.5"/><circle cx="700" cy="292" r="3.5"/><circle cx="720" cy="292" r="3.5"/><circle cx="740" cy="292" r="3.5"/><circle cx="760" cy="292" r="3.5"/><circle cx="780" cy="292" r="3.5"/><circle cx="800" cy="292" r="3.5"/><circle cx="820" cy="292" r="3.5"/>
    <circle cx="680" cy="312" r="3.5"/><circle cx="700" cy="312" r="3.5"/><circle cx="720" cy="312" r="3.5"/><circle cx="740" cy="312" r="3.5"/><circle cx="760" cy="312" r="3.5"/><circle cx="780" cy="312" r="3.5"/><circle cx="800" cy="312" r="3.5"/><circle cx="820" cy="312" r="3.5"/>
    <circle cx="680" cy="332" r="3.5"/><circle cx="700" cy="332" r="3.5"/><circle cx="720" cy="332" r="3.5"/><circle cx="740" cy="332" r="3.5"/><circle cx="760" cy="332" r="3.5"/><circle cx="780" cy="332" r="3.5"/><circle cx="800" cy="332" r="3.5"/><circle cx="820" cy="332" r="3.5"/>
    <circle cx="680" cy="352" r="3.5"/><circle cx="700" cy="352" r="3.5"/><circle cx="720" cy="352" r="3.5"/><circle cx="740" cy="352" r="3.5"/><circle cx="760" cy="352" r="3.5"/><circle cx="780" cy="352" r="3.5"/><circle cx="800" cy="352" r="3.5"/><circle cx="820" cy="352" r="3.5"/>
    <circle cx="680" cy="372" r="3.5"/><circle cx="700" cy="372" r="3.5"/><circle cx="720" cy="372" r="3.5"/><circle cx="740" cy="372" r="3.5"/><circle cx="760" cy="372" r="3.5"/><circle cx="780" cy="372" r="3.5"/><circle cx="800" cy="372" r="3.5"/><circle cx="820" cy="372" r="3.5"/>
    <circle cx="680" cy="392" r="3.5"/><circle cx="700" cy="392" r="3.5"/><circle cx="720" cy="392" r="3.5"/><circle cx="740" cy="392" r="3.5"/><circle cx="760" cy="392" r="3.5"/><circle cx="780" cy="392" r="3.5"/><circle cx="800" cy="392" r="3.5"/><circle cx="820" cy="392" r="3.5"/>
    <circle cx="680" cy="412" r="3.5"/><circle cx="700" cy="412" r="3.5"/><circle cx="720" cy="412" r="3.5"/><circle cx="740" cy="412" r="3.5"/><circle cx="760" cy="412" r="3.5"/><circle cx="780" cy="412" r="3.5"/><circle cx="800" cy="412" r="3.5"/><circle cx="820" cy="412" r="3.5"/>
    <circle cx="680" cy="432" r="3.5"/><circle cx="700" cy="432" r="3.5"/><circle cx="720" cy="432" r="3.5"/><circle cx="740" cy="432" r="3.5"/><circle cx="760" cy="432" r="3.5"/><circle cx="780" cy="432" r="3.5"/><circle cx="800" cy="432" r="3.5"/><circle cx="820" cy="432" r="3.5"/>
  </g>
  <!-- LED strip glowing -->
  <rect x="658" y="470" width="204" height="10" rx="5" fill="url(#ledGrad3)"/>
  <rect x="658" y="470" width="204" height="10" rx="5" fill="#38bdf8" opacity="0.15" filter="url(#softGlow)"/>
  <!-- Brand name -->
  <text x="760" y="506" font-family="Arial, sans-serif" font-size="20" fill="#38bdf8" text-anchor="middle" font-weight="700" letter-spacing="5" opacity="0.9">NEOTECH</text>
  <!-- Control buttons row -->
  <circle cx="706" cy="546" r="16" fill="#0d1e30" stroke="#1e4060" stroke-width="1.5"/>
  <circle cx="760" cy="546" r="16" fill="#0d1e30" stroke="#1e4060" stroke-width="1.5"/>
  <circle cx="814" cy="546" r="16" fill="#0d1e30" stroke="#1e4060" stroke-width="1.5"/>
  <!-- Touch ring on center button -->
  <circle cx="760" cy="546" r="10" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.6"/>

  <!-- Glowing border around speaker -->
  <rect x="638" y="218" width="244" height="384" rx="50" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.4"/>
  <rect x="634" y="214" width="252" height="392" rx="54" fill="none" stroke="#38bdf8" stroke-width="1" opacity="0.15"/>

  <!-- Shadow/reflection -->
  <ellipse cx="760" cy="632" rx="100" ry="16" fill="#38bdf8" opacity="0.06"/>

  <!-- Bottom: price and button strip -->
  <rect x="52" y="740" width="976" height="110" rx="20" fill="#080f1c" stroke="#1e4060" stroke-width="1"/>
  <text x="80" y="800" font-family="Arial, sans-serif" font-size="40" fill="white" font-weight="900">3 490 ₽</text>
  <text x="290" y="797" font-family="Arial, sans-serif" font-size="24" fill="#444" text-decoration="line-through">4 990 ₽</text>
  <text x="80" y="834" font-family="Arial, sans-serif" font-size="18" fill="#38bdf8">★ 4.8  ·  312 отзыва</text>
  <!-- Button -->
  <rect x="720" y="762" width="288" height="68" rx="14" fill="#0ea5e9"/>
  <text x="864" y="803" font-family="Arial, sans-serif" font-size="20" fill="white" font-weight="700" text-anchor="middle">В корзину</text>

  <!-- Headline text above product -->
  <text x="760" y="190" font-family="Arial Black, Arial, sans-serif" font-size="28" fill="white" font-weight="900" text-anchor="middle" letter-spacing="2">УМНАЯ ЭЛЕКТРОНИКА</text>
  <text x="760" y="218" font-family="Arial, sans-serif" font-size="18" fill="#38bdf8" text-anchor="middle" opacity="0.7">360° · BT 5.3 · 30W · IPX6</text>
