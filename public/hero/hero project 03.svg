  <text x="52" y="308" font-family="Arial, sans-serif" font-size="28" fill="#38bdf8" opacity="0.7">готов к размещению</text>

  <!-- Feature badges -->
  <!-- Badge 1 -->
  <rect x="52" y="360" width="220" height="72" rx="12" fill="#0a1828" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.4"/>
  <circle cx="80" cy="396" r="16" fill="#0d2035"/>
  <!-- Bluetooth icon simplified -->
  <text x="80" y="402" font-family="Arial, sans-serif" font-size="16" fill="#38bdf8" text-anchor="middle">BT</text>
  <text x="114" y="389" font-family="Arial, sans-serif" font-size="16" fill="white" font-weight="700">Bluetooth 5.3</text>
  <text x="114" y="412" font-family="Arial, sans-serif" font-size="13" fill="#38bdf8" opacity="0.7">мгновенная связь</text>

  <!-- Badge 2 -->
  <rect x="52" y="448" width="220" height="72" rx="12" fill="#0a1828" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.4"/>
  <circle cx="80" cy="484" r="16" fill="#0d2035"/>
  <text x="80" y="490" font-family="Arial, sans-serif" font-size="14" fill="#38bdf8" text-anchor="middle">30W</text>
