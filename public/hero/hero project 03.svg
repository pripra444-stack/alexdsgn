<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#030a14"/><stop offset="100%" stop-color="#060f1e"/></linearGradient>
    <radialGradient id="mainGlow3" cx="65%" cy="45%" r="55%"><stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.18"/><stop offset="100%" stop-color="#0ea5e9" stop-opacity="0"/></radialGradient>
    <radialGradient id="bottomGlow3" cx="50%" cy="100%" r="50%"><stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.22"/><stop offset="100%" stop-color="#0ea5e9" stop-opacity="0"/></radialGradient>
    <linearGradient id="speakerBody3" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#1a2a3a"/><stop offset="100%" stop-color="#0d1824"/></linearGradient>
    <linearGradient id="ledGrad3" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#0ea5e9" stop-opacity="0"/><stop offset="50%" stop-color="#38bdf8"/><stop offset="100%" stop-color="#0ea5e9" stop-opacity="0"/></linearGradient>
    <filter id="glowFilter3"><feGaussianBlur stdDeviation="8" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="softGlow"><feGaussianBlur stdDeviation="16" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1080" height="1080" fill="url(#bg3)"/>
  <rect width="1080" height="1080" fill="url(#mainGlow3)"/>
  <rect width="1080" height="1080" fill="url(#bottomGlow3)"/>

  <!-- Subtle horizontal light lines -->
  <line x1="0" y1="400" x2="1080" y2="400" stroke="#38bdf8" stroke-width="1" opacity="0.06"/>
  <line x1="0" y1="600" x2="1080" y2="600" stroke="#38bdf8" stroke-width="1" opacity="0.04"/>

  <!-- Counter -->
  <circle cx="52" cy="52" r="9" fill="#38bdf8"/>
  <text x="72" y="58" font-family="Arial, sans-serif" font-size="24" fill="#38bdf8" font-weight="700" letter-spacing="1">03 / 04</text>

  <!-- Left: text content -->
