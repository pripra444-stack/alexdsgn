  <text x="114" y="500" font-family="Arial, sans-serif" font-size="13" fill="#38bdf8" opacity="0.7">чистый звук</text>

  <!-- Badge 3 -->
  <rect x="52" y="536" width="220" height="72" rx="12" fill="#0a1828" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.4"/>
  <circle cx="80" cy="572" r="16" fill="#0d2035"/>
  <text x="80" y="578" font-family="Arial, sans-serif" font-size="13" fill="#38bdf8" text-anchor="middle">IPX6</text>
  <text x="114" y="565" font-family="Arial, sans-serif" font-size="16" fill="white" font-weight="700">Защита IPX6</text>
  <text x="114" y="588" font-family="Arial, sans-serif" font-size="13" fill="#38bdf8" opacity="0.7">водонепроницаемость</text>

  <!-- Badge 4 -->
  <rect x="52" y="624" width="220" height="72" rx="12" fill="#0a1828" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.4"/>
  <circle cx="80" cy="660" r="16" fill="#0d2035"/>
  <text x="80" y="666" font-family="Arial, sans-serif" font-size="12" fill="#38bdf8" text-anchor="middle">360°</text>
  <text x="114" y="653" font-family="Arial, sans-serif" font-size="16" fill="white" font-weight="700">Звук 360°</text>
  <text x="114" y="676" font-family="Arial, sans-serif" font-size="13" fill="#38bdf8" opacity="0.7">объёмный аудио</text>

