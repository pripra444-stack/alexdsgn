<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#06060f"/><stop offset="100%" stop-color="#0c0820"/></linearGradient>
    <radialGradient id="glow2" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#7c3aed" stop-opacity="0.35"/><stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/></radialGradient>
    <radialGradient id="deviceGlow" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2"/><stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/></radialGradient>
    <linearGradient id="devBody" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#1e1e30"/><stop offset="100%" stop-color="#12121e"/></linearGradient>
  </defs>
  <rect width="1080" height="1080" fill="url(#bg2)"/>

  <!-- Glow behind product -->
  <ellipse cx="680" cy="460" rx="320" ry="300" fill="url(#glow2)"/>

  <!-- Counter -->
  <circle cx="52" cy="52" r="9" fill="#7c3aed"/>
  <text x="72" y="58" font-family="Arial, sans-serif" font-size="24" fill="#7c3aed" font-weight="700" letter-spacing="1">02 / 04</text>

  <!-- Title -->
  <text x="52" y="168" font-family="Arial Black, Arial, sans-serif" font-size="88" fill="white" font-weight="900">Разработка</text>
  <text x="52" y="264" font-family="Arial Black, Arial, sans-serif" font-size="88" fill="white" font-weight="900">Hero-экрана</text>
  <text x="52" y="316" font-family="Arial, sans-serif" font-size="30" fill="#555">инженерия визуала</text>

  <!-- Product center: smart speaker -->
  <!-- Outer glow ring -->
  <circle cx="680" cy="460" r="260" fill="none" stroke="#7c3aed" stroke-width="1" stroke-dasharray="6 8" opacity="0.4"/>
  <circle cx="680" cy="460" r="220" fill="none" stroke="#7c3aed" stroke-width="1" stroke-dasharray="3 12" opacity="0.25"/>
  <ellipse cx="680" cy="460" rx="180" ry="180" fill="url(#deviceGlow)"/>

  <!-- Speaker body -->
  <rect x="580" y="300" width="200" height="320" rx="36" fill="url(#devBody)" stroke="#2e2e50" stroke-width="2"/>
  <!-- Speaker grille pattern -->
  <rect x="596" y="330" width="168" height="160" rx="8" fill="#161628"/>
  <!-- Dot grid (speaker holes) -->
  <g fill="#2a2a45" opacity="0.8">
    <circle cx="616" cy="352" r="3"/><circle cx="634" cy="352" r="3"/><circle cx="652" cy="352" r="3"/><circle cx="670" cy="352" r="3"/><circle cx="688" cy="352" r="3"/><circle cx="706" cy="352" r="3"/><circle cx="724" cy="352" r="3"/><circle cx="742" cy="352" r="3"/><circle cx="760" cy="352" r="3"/>
    <circle cx="616" cy="370" r="3"/><circle cx="634" cy="370" r="3"/><circle cx="652" cy="370" r="3"/><circle cx="670" cy="370" r="3"/><circle cx="688" cy="370" r="3"/><circle cx="706" cy="370" r="3"/><circle cx="724" cy="370" r="3"/><circle cx="742" cy="370" r="3"/><circle cx="760" cy="370" r="3"/>
    <circle cx="616" cy="388" r="3"/><circle cx="634" cy="388" r="3"/><circle cx="652" cy="388" r="3"/><circle cx="670" cy="388" r="3"/><circle cx="688" cy="388" r="3"/><circle cx="706" cy="388" r="3"/><circle cx="724" cy="388" r="3"/><circle cx="742" cy="388" r="3"/><circle cx="760" cy="388" r="3"/>
    <circle cx="616" cy="406" r="3"/><circle cx="634" cy="406" r="3"/><circle cx="652" cy="406" r="3"/><circle cx="670" cy="406" r="3"/><circle cx="688" cy="406" r="3"/><circle cx="706" cy="406" r="3"/><circle cx="724" cy="406" r="3"/><circle cx="742" cy="406" r="3"/><circle cx="760" cy="406" r="3"/>
    <circle cx="616" cy="424" r="3"/><circle cx="634" cy="424" r="3"/><circle cx="652" cy="424" r="3"/><circle cx="670" cy="424" r="3"/><circle cx="688" cy="424" r="3"/><circle cx="706" cy="424" r="3"/><circle cx="724" cy="424" r="3"/><circle cx="742" cy="424" r="3"/><circle cx="760" cy="424" r="3"/>
    <circle cx="616" cy="442" r="3"/><circle cx="634" cy="442" r="3"/><circle cx="652" cy="442" r="3"/><circle cx="670" cy="442" r="3"/><circle cx="688" cy="442" r="3"/><circle cx="706" cy="442" r="3"/><circle cx="724" cy="442" r="3"/><circle cx="742" cy="442" r="3"/><circle cx="760" cy="442" r="3"/>
    <circle cx="616" cy="460" r="3"/><circle cx="634" cy="460" r="3"/><circle cx="652" cy="460" r="3"/><circle cx="670" cy="460" r="3"/><circle cx="688" cy="460" r="3"/><circle cx="706" cy="460" r="3"/><circle cx="724" cy="460" r="3"/><circle cx="742" cy="460" r="3"/><circle cx="760" cy="460" r="3"/>
  </g>
  <!-- LED strip -->
  <rect x="596" y="500" width="168" height="10" rx="5" fill="#7c3aed" opacity="0.6"/>
  <!-- Brand name on speaker -->
  <text x="680" y="540" font-family="Arial, sans-serif" font-size="18" fill="#555" text-anchor="middle" font-weight="700" letter-spacing="4">NEOTECH</text>
  <!-- Buttons -->
  <circle cx="634" cy="570" r="12" fill="#1e1e32" stroke="#2e2e48" stroke-width="1.5"/>
  <circle cx="680" cy="570" r="12" fill="#1e1e32" stroke="#2e2e48" stroke-width="1.5"/>
  <circle cx="726" cy="570" r="12" fill="#1e1e32" stroke="#2e2e48" stroke-width="1.5"/>

  <!-- Annotation callouts (connecting lines to product) -->
  <!-- Top-left callout: НАТУРАЛЬНЫЙ СОСТАВ -->
  <line x1="575" y1="340" x2="380" y2="280" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.6"/>
  <circle cx="575" cy="340" r="4" fill="#7c3aed" opacity="0.8"/>
  <rect x="140" y="240" width="240" height="72" rx="10" fill="#12121e" stroke="#7c3aed" stroke-width="1" opacity="0.9"/>
  <text x="260" y="271" font-family="Arial, sans-serif" font-size="17" fill="white" font-weight="700" text-anchor="middle">BLUETOOTH 5.3</text>
  <text x="260" y="295" font-family="Arial, sans-serif" font-size="14" fill="#7c3aed" text-anchor="middle">быстрое подключение</text>

  <!-- Right callout: top -->
  <line x1="785" y1="340" x2="900" y2="280" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.6"/>
  <circle cx="785" cy="340" r="4" fill="#7c3aed" opacity="0.8"/>
  <rect x="900" y="240" width="160" height="72" rx="10" fill="#12121e" stroke="#7c3aed" stroke-width="1" opacity="0.9"/>
  <text x="980" y="271" font-family="Arial, sans-serif" font-size="17" fill="white" font-weight="700" text-anchor="middle">30 Вт</text>
  <text x="980" y="295" font-family="Arial, sans-serif" font-size="14" fill="#7c3aed" text-anchor="middle">мощность</text>

  <!-- Left middle callout -->
  <line x1="578" y1="460" x2="380" y2="480" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.6"/>
  <circle cx="578" cy="460" r="4" fill="#7c3aed" opacity="0.8"/>
  <rect x="140" y="444" width="240" height="72" rx="10" fill="#12121e" stroke="#7c3aed" stroke-width="1" opacity="0.9"/>
  <text x="260" y="475" font-family="Arial, sans-serif" font-size="17" fill="white" font-weight="700" text-anchor="middle">360° ЗВУК</text>
  <text x="260" y="499" font-family="Arial, sans-serif" font-size="14" fill="#7c3aed" text-anchor="middle">объёмный аудио</text>

  <!-- Right middle callout -->
  <line x1="782" y1="460" x2="900" y2="480" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.6"/>
  <circle cx="782" cy="460" r="4" fill="#7c3aed" opacity="0.8"/>
  <rect x="900" y="444" width="160" height="72" rx="10" fill="#12121e" stroke="#7c3aed" stroke-width="1" opacity="0.9"/>
  <text x="980" y="475" font-family="Arial, sans-serif" font-size="17" fill="white" font-weight="700" text-anchor="middle">12 часов</text>
  <text x="980" y="499" font-family="Arial, sans-serif" font-size="14" fill="#7c3aed" text-anchor="middle">работы</text>

  <!-- Bottom callout -->
  <line x1="680" y1="622" x2="680" y2="680" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.6"/>
  <circle cx="680" cy="622" r="4" fill="#7c3aed" opacity="0.8"/>
  <rect x="540" y="680" width="280" height="72" rx="10" fill="#12121e" stroke="#7c3aed" stroke-width="1" opacity="0.9"/>
  <text x="680" y="711" font-family="Arial, sans-serif" font-size="17" fill="white" font-weight="700" text-anchor="middle">IPX6 ЗАЩИТА</text>
  <text x="680" y="735" font-family="Arial, sans-serif" font-size="14" fill="#7c3aed" text-anchor="middle">водонепроницаемость</text>

  <!-- Bottom info -->
  <rect x="52" y="820" width="976" height="84" rx="14" fill="#0f0f18"/>
  <text x="80" y="867" font-family="Arial, sans-serif" font-size="20" fill="white" font-weight="700">Решение: </text>
  <text x="212" y="867" font-family="Arial, sans-serif" font-size="20" fill="#555">визуал подчёркивает технологии и преимущества продукта</text>
</svg>
