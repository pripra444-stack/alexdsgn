    <!-- ── Fonts: preconnect + non-blocking load ─────────────────────
         media="print" → loads without blocking render → onload switches to "all"
         Saves ~2 seconds of render-blocking time.
    ──────────────────────────────────────────────────────────────── -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://images.unsplash.com" />

    <!-- Only the weights we actually use: 400, 500, 700 -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;700&family=Geist+Mono:wght@400&display=swap"
      media="print"
      onload="this.media='all'"
    />
