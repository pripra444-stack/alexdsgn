<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Watch Card</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Oswald:wght@400;600;700&family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #111;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: 'Inter', sans-serif;
  }

  .card {
    position: relative;
    width: 600px;
    height: 800px;
    border-radius: 16px;
    overflow: hidden;
    background: linear-gradient(135deg, #0a0f2e 0%, #0d1535 40%, #1a0a2e 70%, #2d0a3e 100%);
  }

  /* фоновые glow-пятна */
  .card::before {
    content: '';
    position: absolute;
    inset: 0;
    background:
      radial-gradient(ellipse 60% 50% at 75% 50%, rgba(220, 60, 180, 0.35) 0%, transparent 70%),
      radial-gradient(ellipse 40% 60% at 85% 20%, rgba(180, 40, 220, 0.25) 0%, transparent 60%),
      radial-gradient(ellipse 50% 40% at 60% 70%, rgba(0, 180, 255, 0.15) 0%, transparent 60%);
    pointer-events: none;
    z-index: 0;
  }

  /* ---- ЗАГОЛОВОК ---- */
  .title-block {
    position: absolute;
    top: 28px;
    left: 28px;
    z-index: 10;
    line-height: 0.88;
  }

  .title-smart {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 88px;
    letter-spacing: 4px;
    color: #fff;
    text-shadow: 0 0 40px rgba(0, 200, 255, 0.4);
  }

  .title-watch {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 88px;
    letter-spacing: 4px;
    color: #fff;
    text-shadow: 0 0 40px rgba(0, 200, 255, 0.4);
  }

  /* бейдж 10 SERIES */
  .badge-series {
    position: absolute;
    top: 108px;
    left: 298px;
    background: rgba(20, 28, 60, 0.85);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 6px;
    padding: 5px 12px;
    font-family: 'Oswald', sans-serif;
    font-size: 16px;
    font-weight: 600;
    color: #fff;
    letter-spacing: 1px;
    z-index: 10;
    backdrop-filter: blur(8px);
  }

  /* мозг emoji */
  .brain-icon {
    position: absolute;
    top: 10px;
    left: 310px;
    font-size: 52px;
    z-index: 10;
    filter: drop-shadow(0 0 16px rgba(0, 180, 255, 0.8)) drop-shadow(0 0 32px rgba(0, 120, 255, 0.5));
  }

  /* PREMIUM 2025 вертикально справа */
  .premium-text {
    position: absolute;
    right: -72px;
    top: 50%;
    transform: translateY(-50%) rotate(90deg);
    font-family: 'Bebas Neue', sans-serif;
    font-size: 72px;
    letter-spacing: 6px;
    color: transparent;
    -webkit-text-stroke: 1.5px rgba(255, 80, 180, 0.6);
    white-space: nowrap;
    z-index: 10;
    pointer-events: none;
  }

  /* ---- ЧАСЫ ---- */
  .watch-container {
    position: absolute;
    right: 20px;
    top: 60px;
    width: 340px;
    height: 680px;
    z-index: 5;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .watch-svg {
    width: 100%;
    height: 100%;
    filter:
      drop-shadow(0 0 40px rgba(0, 200, 255, 0.6))
      drop-shadow(0 0 80px rgba(0, 100, 255, 0.3))
      drop-shadow(0 20px 60px rgba(0,0,0,0.8));
  }

  @keyframes tick-seconds {
    from { transform: rotate(0deg); transform-origin: 50% 82%; }
    to   { transform: rotate(360deg); transform-origin: 50% 82%; }
  }
  @keyframes tick-minutes {
    from { transform: rotate(0deg); transform-origin: 50% 72%; }
    to   { transform: rotate(360deg); transform-origin: 50% 72%; }
  }
  @keyframes tick-hours {
    from { transform: rotate(0deg); transform-origin: 50% 62%; }
    to   { transform: rotate(360deg); transform-origin: 50% 62%; }
  }
  .hand-sec  { animation: tick-seconds 60s linear infinite; }
  .hand-min  { animation: tick-minutes 3600s linear infinite; }
  .hand-hour { animation: tick-hours 43200s linear infinite; }

  /* ---- ФИЧИ (glassmorphism пилюли) ---- */
  .features {
    position: absolute;
    left: 24px;
    top: 210px;
    z-index: 10;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .feature-pill {
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid rgba(255, 255, 255, 0.12);
    border-radius: 10px;
    padding: 12px 20px;
    backdrop-filter: blur(16px);
    min-width: 220px;
  }

  .feature-label {
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 1.5px;
    color: rgba(255, 255, 255, 0.55);
    text-transform: uppercase;
    margin-bottom: 2px;
  }

  .feature-value {
    font-family: 'Oswald', sans-serif;
    font-size: 30px;
    font-weight: 700;
    color: #fff;
    letter-spacing: 1px;
    line-height: 1;
    text-shadow: 0 0 20px rgba(0, 200, 255, 0.3);
  }

  /* ---- ПОДАРОК (нижний правый угол) ---- */
  .gift-block {
    position: absolute;
    bottom: 28px;
    right: 28px;
    z-index: 10;
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid rgba(255, 255, 255, 0.12);
    border-radius: 10px;
    padding: 12px 18px 12px 14px;
    backdrop-filter: blur(16px);
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .gift-icon {
    font-size: 42px;
    filter: drop-shadow(0 0 12px rgba(0, 180, 255, 0.9)) drop-shadow(0 0 24px rgba(0, 100, 255, 0.6));
    line-height: 1;
  }

  .gift-text {
    display: flex;
    flex-direction: column;
  }

  .gift-label {
    font-size: 10px;
    font-weight: 500;
    letter-spacing: 1.5px;
    color: rgba(255, 255, 255, 0.55);
    text-transform: uppercase;
  }

  .gift-value {
    font-family: 'Oswald', sans-serif;
    font-size: 22px;
    font-weight: 700;
    color: #fff;
    letter-spacing: 1px;
    line-height: 1;
  }
</style>
</head>
